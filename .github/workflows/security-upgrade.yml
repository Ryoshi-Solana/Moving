name: Security Upgrade Validation

on:
  push:
    branches:
      - security/next16-upgrade

permissions:
  contents: write

concurrency:
  group: security-upgrade-validation
  cancel-in-progress: true

jobs:
  validate-upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Clean install from lockfile
        run: npm ci
      - name: Apply non-breaking dependency security fixes
        run: npm audit fix
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run tests
        run: npm test
      - name: TypeScript check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit lockfile security fixes
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix: patch transitive dependency vulnerabilities"
            git push origin HEAD:security/next16-upgrade
          else
            echo "Lockfile already up to date."
          fi
