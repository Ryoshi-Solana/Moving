name: tmp-visual-review
on:
  push:
    branches: [tmp/visual-review]
    paths: [url.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download screenshots from the review sandbox and commit them
        run: |
          rm -rf shots && mkdir shots && cd shots
          wget -q -r -np -nd -A jpg,png,webp "$(cat ../url.txt)" || true
          cd ..
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add shots && git commit -qm "tmp: screenshots [skip ci]" && git push
