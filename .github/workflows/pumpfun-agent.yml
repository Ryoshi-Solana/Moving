name: pump.fun agent

on:
  push:
    branches: [main]
    paths: ["pumpfun_agent/**", ".github/workflows/pumpfun-agent.yml"]
  pull_request:
    branches: [main]
    paths: ["pumpfun_agent/**", ".github/workflows/pumpfun-agent.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pumpfun_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run offline tests
        run: python -m pytest -q tests
